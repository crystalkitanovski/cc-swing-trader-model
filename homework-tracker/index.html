<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Homework Tracker</title>
<meta name="description" content="Track your homework and get reminders before it's due." />
<meta name="theme-color" content="#4f46e5" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1>📚 My Homework</h1>
    <button id="notifyBtn" class="btn btn-ghost" title="Turn on due-date reminders">🔔 Reminders: off</button>
  </header>

  <section class="summary" id="summary"></section>

  <section class="add-card">
    <button id="addToggle" class="btn btn-primary">+ Add Assignment</button>
    <form id="addForm" class="add-form hidden">
      <div class="row">
        <label>
          Subject
          <input list="subjectList" id="subject" name="subject" placeholder="Math" required />
          <datalist id="subjectList"></datalist>
        </label>
        <label>
          Due date
          <input type="date" id="dueDate" name="dueDate" required />
        </label>
      </div>
      <label>
        Assignment
        <input type="text" id="title" name="title" placeholder="Ch. 5 worksheet, pg. 112 #1-20" required />
      </label>
      <label>
        Notes <span class="optional">(optional)</span>
        <textarea id="notes" name="notes" rows="2" placeholder="Bring textbook, show all work..."></textarea>
      </label>
      <label>
        Remind me
        <select id="reminderLead">
          <option value="0">On the due date</option>
          <option value="1" selected>1 day before</option>
          <option value="2">2 days before</option>
          <option value="3">3 days before</option>
        </select>
      </label>
      <div class="row form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" id="cancelAdd" class="btn btn-ghost">Cancel</button>
      </div>
    </form>
  </section>

  <section class="filters" id="filters"></section>

  <main id="lists"></main>

  <section class="empty-state hidden" id="emptyState">
    <p>No homework yet. Tap <strong>+ Add Assignment</strong> to get started.</p>
  </section>

  <details class="completed-wrap">
    <summary>✅ Completed (<span id="completedCount">0</span>)</summary>
    <div id="completedList"></div>
  </details>

  <footer class="foot">
    <span>Everything is saved on this device only.</span>
    <button id="exportBtn" class="btn btn-link">Export backup</button>
    <label class="btn btn-link import-label">
      Import backup
      <input type="file" id="importInput" accept="application/json" hidden />
    </label>
  </footer>

</div>

<div id="editDialogBackdrop" class="dialog-backdrop hidden">
  <div class="dialog" role="dialog" aria-modal="true">
    <h2>Edit Assignment</h2>
    <form id="editForm">
      <input type="hidden" id="editId" />
      <label>
        Subject
        <input list="subjectList" id="editSubject" required />
      </label>
      <label>
        Due date
        <input type="date" id="editDueDate" required />
      </label>
      <label>
        Assignment
        <input type="text" id="editTitle" required />
      </label>
      <label>
        Notes
        <textarea id="editNotes" rows="2"></textarea>
      </label>
      <label>
        Remind me
        <select id="editReminderLead">
          <option value="0">On the due date</option>
          <option value="1">1 day before</option>
          <option value="2">2 days before</option>
          <option value="3">3 days before</option>
        </select>
      </label>
      <div class="row form-actions">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <button type="button" id="deleteBtn" class="btn btn-danger">Delete</button>
        <button type="button" id="cancelEdit" class="btn btn-ghost">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
